[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reqeval-api"
version = "0.1.0"
description = "Backend workspace for the AI requirement evaluation platform"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.6.12",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=1.3.11,<2",
    "langchain-anthropic>=1.4.7,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-google-genai>=4.2.5,<5",
    "langchain-openai>=1.1,<2",
    "langgraph>=1,<2",
    "numpy==1.26.0",
    "openpyxl==3.1.2",
    "pandas==2.2.0",
    "pydantic>=2.10,<3",
    "pymongo>=4.10,<5",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "matplotlib==3.8.0",
    "plotly==5.18.0",
    "pypdf>=5,<7",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
